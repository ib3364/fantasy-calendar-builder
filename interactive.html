[data-theme="blood"]{--bg:#000000;--surface:#191C24;--surface2:#14161c;--border:#2a2d38;--border2:#20222b;--accent:#EB1616;--accent2:#ff4d4d;--text:#ffffff;--text-muted:#6C7293;--text-dim:#4a4e63;--text-dimmer:#33364d;--text-dimmest:#202230;--input-bg:#191C24;--input-bg2:#14161c;--card-bg:#191C24;--card-border:#2a2d38;--month-name:#EB1616;--moon-pill-bg:rgba(235,22,22,0.1);--moon-pill-border:rgba(235,22,22,0.35);--moon-pill-text:#ff6b6b;--accent-rgb:235,22,22;--font-display:'Roboto',sans-serif;--font-body:'Open Sans',sans-serif;--shadow:0 4px 20px rgba(0,0,0,0.5)}
[data-theme="neon"]{--bg:#200e35;--surface:#2a1245;--surface2:#25103d;--border:#4d1d85;--border2:#3f1c66;--accent:#1befc5;--accent2:#7836c6;--text:#ffffff;--text-muted:#c7b8dc;--text-dim:#8a6ba8;--text-dimmer:#5a3a78;--text-dimmest:#3a1f52;--input-bg:#25103d;--input-bg2:#200e35;--card-bg:#2a1245;--card-border:#4d1d85;--month-name:#1befc5;--moon-pill-bg:rgba(27,239,197,0.1);--moon-pill-border:rgba(27,239,197,0.35);--moon-pill-text:#1befc5;--accent-rgb:27,239,197;--font-display:'Raleway',sans-serif;--font-body:'Raleway',sans-serif;--shadow:0 20px 50px rgba(32,14,53,0.5)}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;transition:background .4s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}

height='6'/%3E%3Crect x='30' y='46' width='6' height='6'/%3E%3Crect x='54' y='46' width='6' height='6'/%3E%3Crect x='18' y='58' width='6' height='6'/%3E%3Crect x='42' y='58' width='6' height='6'/%3E%3Crect x='66' y='70' width='6' height='6'/%3E%3Crect x='30' y='70' width='6' height='6'/%3E%3C/g%3E%3C/svg%3E");background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,no-repeat;background-position:3% 5%,95% 4%,-15px 100%,calc(100% + 15px) 100%,90% 78%;background-size:150px 70px,120px 60px,70px 300px,55px 260px,100px 100px}
.iv-loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;color:var(--text-dim)}

<style>
/* ── Chooser overlay ── */
.iv-chooser{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:1.5rem}
.iv-chooser-inner{max-width:760px;width:100%;text-align:center}
.iv-chooser h1{font-family:var(--font-display);font-size:1.8rem;color:var(--text);margin-bottom:.5rem}
.iv-chooser p{color:var(--text-dim);margin-bottom:2rem;font-size:.95rem}
.iv-choices{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:640px){.iv-choices{grid-template-columns:1fr}}
#fcb-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text,#222);color:var(--bg,#fff);padding:.7rem 1.1rem;border-radius:8px;font-size:.85rem;font-family:var(--font-body);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;display:flex;align-items:center;gap:.5rem;max-width:90vw}
#fcb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fcb-toast .fcb-toast-check{color:#4ade80;font-weight:800}

/* ═══ MOBILE: stack all metaphor layouts vertically ═══ */
@media(max-width:760px){
  /* all stage wrappers: reduce padding, allow vertical scroll */
  .tac-stage,.grim-stage,.neon-stage{
    padding:.6rem .5rem;align-items:flex-start;display:block;min-height:0
  }
  /* all 2-column grids -> single column, auto height */
  .tac-console,.grim-book,.neon-term{
    grid-template-columns:1fr!important;width:100%!important;max-height:none!important;aspect-ratio:auto!important
  }
  /* left (index) columns: cap height so the list doesn't eat the whole screen, give a divider */
  .tac-left,.grim-left,.neon-left{
    border-right:none!important;max-height:42vh;overflow-y:auto
  }
  .tac-left{border-bottom:1px solid rgba(66,42,251,.18)}
  .grim-left{border-bottom:1px solid rgba(235,22,22,.18)}
  .neon-left{border-bottom:1px solid rgba(27,239,197,.18)}
  /* trim heavy content padding on phones */
  .tac-left,.tac-right,.grim-left,.grim-right,.neon-left,.neon-right{
    padding:1rem 1.1rem!important
  }
  /* detail headings a touch smaller so they don't overflow */
  .tac-dossier-name,.grim-leaf-name,.neon-data-name{
    font-size:1.25rem!important
  }
  /* EDIT PHASE: stack the control sidebar above the preview instead of 300px side-column */
  .iv-edit-wrap{grid-template-columns:1fr!important;display:flex!important;flex-direction:column!important;height:auto!important}
  .iv-edit-sidebar{border-right:none!important;border-bottom:1px solid var(--border);max-height:38vh;flex:none}
  .iv-edit-preview{min-height:55vh}
  .iv-stage{position:static!important;inset:auto!important;height:auto!important}
  /* TOOLBAR: let it wrap and shrink on phones instead of overflowing a fixed 54px row */
  .iv-toolbar{position:static!important;height:auto!important;flex-wrap:wrap;gap:.5rem .6rem;padding:.6rem .7rem}
  .iv-toolbar-left{flex:1 1 100%;justify-content:space-between;gap:.5rem;min-width:0}
  .iv-toolbar-title{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .iv-toolbar-left .iv-tab-group{flex:none}
  .iv-toolbar>div:last-child{flex:1 1 100%;display:flex;gap:.5rem}
  .iv-toolbar>div:last-child .iv-btn{flex:1;padding:.5rem .4rem;font-size:.76rem;white-space:nowrap}
  .iv-tab{padding:.4rem .7rem;font-size:.78rem}
  /* the share box / stage no longer need fixed offsets since the toolbar isn't fixed */
  .iv-share-box{position:static!important;top:auto!important}
  .iv-share-box+.iv-stage{top:auto!important}
}
.iv-choice{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2rem 1.5rem;cursor:pointer;transition:all .2s;text-align:center}
.iv-choice:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
.iv-choice-icon{font-size:2.4rem;margin-bottom:.8rem}
.iv-choice h2{font-family:var(--font-display);font-size:1.15rem;color:var(--accent);margin-bottom:.5rem}
.iv-choice p{font-size:.82rem;color:var(--text-muted);margin:0;line-height:1.5}

/* ── Phase toolbar ── */
.iv-toolbar{position:fixed;top:0;left:0;right:0;height:54px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;z-index:50}
.iv-share-box{position:fixed;top:54px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:.7rem 1.2rem;z-index:49}
.iv-share-label{display:block;font-size:.74rem;color:var(--text-muted);margin-bottom:.4rem}
.iv-share-row{display:flex;gap:.5rem;max-width:640px}
.iv-share-url{flex:1;background:var(--input-bg,#fff);border:1px solid var(--border);padding:.5rem .7rem;color:var(--text);font-size:.78rem;border-radius:4px;outline:none}
.iv-share-box+.iv-stage{top:120px}
.iv-stage-shared{position:fixed!important;inset:0!important;top:0!important;overflow:auto;background:var(--bg)}
.iv-toolbar-left{display:flex;align-items:center;gap:.8rem}
.iv-toolbar-title{font-family:var(--font-display);font-size:1rem;color:var(--text)}
.iv-tab-group{display:flex;gap:.4rem;background:var(--input-bg);border-radius:6px;padding:.2rem}
.iv-tab{background:none;border:none;color:var(--text-dim);padding:.4rem .9rem;font-size:.8rem;cursor:pointer;border-radius:4px;font-family:var(--font-body)}
.iv-tab.active{background:var(--accent);color:var(--bg)}
.iv-btn{background:var(--accent);color:var(--bg);border:none;padding:.5rem 1rem;font-size:.82rem;font-weight:700;cursor:pointer;border-radius:5px;font-family:var(--font-body)}
.iv-btn:hover{opacity:.9}
.iv-btn-ghost{background:none;border:1px solid var(--border);color:var(--text-muted)}
.iv-btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ── Stage (holds preview or edit) ── */
.iv-stage{position:fixed;top:54px;left:0;right:0;bottom:0;overflow:auto}

/* ── Edit panel ── */
.iv-edit-wrap{display:grid;grid-template-columns:300px 1fr;height:100%}
.iv-edit-sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:1rem}
.iv-edit-preview{overflow:auto;position:relative}
.iv-edit-section{margin-bottom:1.3rem}
.iv-edit-label{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-bottom:.6rem}
.iv-edit-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.iv-mini-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:.3rem .65rem;font-size:.72rem;cursor:pointer;border-radius:4px;font-family:var(--font-body)}
.iv-mini-btn:hover{background:rgba(var(--accent-rgb),.1)}
.iv-edit-hint{font-size:.7rem;color:var(--text-dim);line-height:1.4;margin-top:.3rem}
.iv-slot-select{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:.45rem;border-radius:4px;font-family:var(--font-body);font-size:.8rem;margin-bottom:.5rem}

/* ── Icon/Font picker modals ── */
.iv-modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:1rem}
.iv-modal.open{display:flex}
.iv-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card,10px);width:100%;max-width:560px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.iv-modal-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--border);flex-shrink:0}
.iv-modal-title{font-family:var(--font-display);font-size:1rem;color:var(--text);font-weight:700}
.iv-modal-close{background:transparent;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer;padding:.3rem .5rem;border-radius:4px;line-height:1}
.iv-modal-close:hover{background:var(--input-bg);color:var(--accent)}
.iv-modal-search{padding:.8rem 1.2rem;border-bottom:1px solid var(--border);flex-shrink:0}
.iv-modal-search input{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:.55rem .8rem;border-radius:6px;font-size:.85rem;font-family:var(--font-body);outline:none;box-sizing:border-box}
.iv-modal-search input:focus{border-color:var(--accent)}
.iv-modal-body{overflow-y:auto;padding:1rem 1.2rem;flex:1}
.iv-iconlib-cats{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 1.2rem .8rem;flex-shrink:0}
.iv-icon-cat{background:var(--input-bg);border:1px solid var(--border);color:var(--text-muted);padding:.35rem .7rem;font-size:.72rem;border-radius:999px;cursor:pointer;font-family:var(--font-body)}
.iv-icon-cat:hover{border-color:var(--accent);color:var(--accent)}
#iv-iconlib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:.5rem}
.iv-icon-opt{background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iv-icon-opt:hover{border-color:var(--accent)}
.iv-font-opt{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:.5rem .8rem;font-size:.95rem;border-radius:6px;cursor:pointer;text-align:left}
.iv-font-opt:hover{border-color:var(--accent)}
.iv-font-opt.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.08);color:var(--accent)}

/* ═══ NOVA HORIZON — clean dashboard-style calendar view ═══ */
.tac-stage{display:flex;align-items:stretch;justify-content:center;min-height:100%;padding:1.6rem 1.2rem}
.tac-console{display:grid;grid-template-columns:300px 1fr;width:min(1000px,100%);max-height:84vh;background:#ffffff;border:1px solid #E9ECEF;border-radius:20px;position:relative;overflow:hidden;font-family:var(--font-body),'DM Sans',sans-serif;box-shadow:0 18px 40px rgba(112,144,176,0.16),0 4px 12px rgba(112,144,176,0.08)}
.tac-left{border-right:1px solid #E9ECEF;padding:1.3rem 1.1rem;overflow-y:auto;position:relative;z-index:2;background:#F4F7FE}
.tac-right{padding:1.6rem 1.7rem;overflow-y:auto;position:relative;z-index:2}
.tac-sys-label{font-size:.68rem;letter-spacing:.08em;color:#A3AED0;text-transform:uppercase;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem;font-weight:600}
.tac-sys-label::before{content:'';width:7px;height:7px;border-radius:50%;background:#422AFB}
.tac-world-name{font-family:var(--font-display),'Poppins',sans-serif;font-size:1.2rem;font-weight:700;color:#1B2559;line-height:1.2;margin-bottom:.3rem}
.tac-era{font-size:.72rem;color:#707EAE;letter-spacing:.03em;margin-bottom:.9rem}
.tac-world-lore{font-size:.8rem;line-height:1.6;color:#707EAE;border:1px solid #E9ECEF;border-radius:12px;background:#eef1fd;padding:.7rem .8rem;margin-bottom:1rem}
.tac-index-label{font-size:.68rem;letter-spacing:.04em;color:#A3AED0;text-transform:uppercase;margin-bottom:.6rem;padding-bottom:.5rem;border-bottom:1px solid #E9ECEF;font-weight:600}
.tac-month-list{list-style:none;margin:0;padding:0}
.tac-wp{display:flex;align-items:center;gap:.6rem;padding:.55rem .6rem;cursor:pointer;color:#707EAE;font-size:.86rem;border:1px solid transparent;border-radius:12px;transition:all .15s;position:relative;margin-bottom:3px}
.tac-wp:hover{background:#eef1fd;color:#1B2559}
.tac-wp.active{background:rgba(66,42,251,.08);border-color:rgba(66,42,251,.25);color:#422AFB}
.tac-diamond{width:8px;height:8px;border-radius:50%;background:#CBD5E0;flex-shrink:0;transition:all .2s}
.tac-wp:hover .tac-diamond{background:#A3AED0}
.tac-wp.active .tac-diamond{background:#422AFB;box-shadow:0 0 0 4px rgba(66,42,251,.15)}
.tac-wp-id{font-family:var(--font-body),'DM Sans',sans-serif;font-weight:600;font-size:.7rem;color:#CBD5E0;min-width:1.8rem}
.tac-wp.active .tac-wp-id{color:#422AFB}
.tac-wp-name{flex:1}
.tac-wp-ico{width:16px;height:16px;object-fit:contain;opacity:0;transition:opacity .2s}
.tac-wp:hover .tac-wp-ico{opacity:1}
/* month detail panel */
.tac-dossier{position:relative}
.tac-dossier.locking{animation:tac-slide .25s ease-out}

</style>
<script>
/* ═══ Interactive View — core ═══ */
let IV = { data:null, theme:'waypoint', months:[], moons:[], events:[],
           selectedMonth:0, lorePage:0, font:'', customFontFace:'',
           perLoreBg:{}, /* key "monthIdx:loreIdx" -> css background */
           perLoreColor:{} /* key "monthIdx:loreIdx" -> text color */ };

function ivDecode(){
  const params=new URLSearchParams(location.search);
  const c=params.get('c');
  if(!c)return null;
  const strategies=[
    ()=>JSON.parse(decodeURIComponent(atob(c))),
    ()=>JSON.parse(atob(c)),
    ()=>JSON.parse(decodeURIComponent(decodeURIComponent(atob(c)))),
    ()=>JSON.parse(decodeURIComponent(atob(decodeURIComponent(c)))),
  ];
  for(const s of strategies){try{const d=s();if(d&&d.w!==undefined)return d;}catch(e){}}
  return null;
}

function ivSplitLore(loreStr){
  if(!loreStr||!loreStr.trim())return [];
  // Multiple lore entries separated by blank line or --- delimiter
  return loreStr.split(/\n\s*\n|\s*---\s*/).map(s=>s.trim()).filter(Boolean);
}

/* ── Supabase locker loader ── */
const SB_URL='https://rqrqxrngqtaywmhkdoal.supabase.co';
const SB_KEY='sb_publishable_Hvg22Fb6JhnA81umnhoSYw_uIitY5E7';
async function ivLoadFromLocker(id){
  const res=await fetch(SB_URL+'/rest/v1/calendars?id=eq.'+encodeURIComponent(id)+'&select=data',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  });
  if(!res.ok)throw new Error('load failed '+res.status);
  const rows=await res.json();
  if(!rows||!rows.length)throw new Error('not found');
  return rows[0].data;
}
function ivGenId(){
  const chars='abcdefghijklmnopqrstuvwxyz0123456789';
  let s='';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
// Save the FULL customized interactive state (base calendar + all edit-phase
// customizations) so a shared link reproduces exactly what was customized.
async function ivShareLink(){
  const bundle={
    __iv:true,
    data:IV.data, theme:IV.theme, font:IV.font, customFontFace:IV.customFontFace||'',
    perLoreBg:IV.perLoreBg||{}, perLoreColor:IV.perLoreColor||{},
    months:IV.months, moons:IV.moons, events:IV.events
  };
  const box=document.getElementById('iv-share-box');
  const input=document.getElementById('iv-share-url');
  if(box)box.style.display='block';
  if(input)input.value='Saving your interactive world…';
  try{
    const id=ivGenId();
    const res=await fetch(SB_URL+'/rest/v1/calendars',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return-minimal'},
      body:JSON.stringify({id:id,data:bundle})
    });
    if(!res.ok)throw new Error('save failed '+res.status);
    const url=location.origin+'/interactive.html?iv='+id;
    if(input)input.value=url;
  }catch(e){
    console.error('share save failed:',e);
    if(input)input.value='Could not save — check connection and try again.';
  }
}
function ivCopyShare(){
  const input=document.getElementById('iv-share-url');
  if(!input||!input.value.startsWith('http'))return;
  input.select();input.setSelectionRange(0,99999);
  try{navigator.clipboard.writeText(input.value);}catch(e){try{document.execCommand('copy');}catch(e2){}}
  const btn=document.getElementById('iv-share-copy');
  if(btn){const t=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=t,1500);}
}

async function ivInit(){
  const params=new URLSearchParams(location.search);
  const ivId=params.get('iv');
  const id=params.get('id');

  // Shared INTERACTIVE link: load the full customized bundle, read-only
  if(ivId){
    try{
      const bundle=await ivLoadFromLocker(ivId);
      if(bundle&&bundle.__iv){
        IV.data=bundle.data;
        IV.theme=bundle.theme||'waypoint';
        document.documentElement.setAttribute('data-theme',IV.theme);
        IV.months=bundle.months||[];
        IV.moons=bundle.moons||[];
        IV.events=bundle.events||[];
        IV.font=bundle.font||'';
        IV.customFontFace=bundle.customFontFace||'';
        IV.perLoreBg=bundle.perLoreBg||{};
        IV.perLoreColor=bundle.perLoreColor||{};
        if(IV.customFontFace){const st=document.createElement('style');st.textContent=IV.customFontFace;document.head.appendChild(st);}
        else if(IV.font)ivLoadGFont(IV.font);
        ivStartShared();   // read-only preview, no edit access
        return;
      }
    }catch(e){ console.error('shared interactive load failed:',e); }
    document.getElementById('iv-root').innerHTML='<div class="iv-loading"><div>This interactive link could not be loaded. <a href="builder.html" style="color:var(--accent)">Build one →</a></div></div>';
    return;
  }

  let data=null;
  if(id){
    try{ data=await ivLoadFromLocker(id); }
    catch(e){ console.error('locker load failed:',e); }
  } else {
    data=ivDecode();
  }
  if(!data||data.w===undefined){
    document.getElementById('iv-root').innerHTML='<div class="iv-loading"><div>No calendar found. <a href="builder.html" style="color:var(--accent)">Build one →</a></div></div>';
    return;
  }
  IV.data=data;
  IV.theme=localStorage.getItem('fcb-theme')||'waypoint';
  document.documentElement.setAttribute('data-theme',IV.theme);
  IV.months=(data.m||[]).map(s=>{const p=s.split('|');return{name:p[0],days:p[1],lore:(p[2]||'').replace(/‖/g,'|'),icon:p[3]||''};});
  IV.moons=(data.mo||[]).map(s=>{const p=s.split('|');return{name:p[0],cycle:parseInt(p[1]),lore:(p[2]||'').replace(/‖/g,'|'),icon:p[3]||''};});
  IV.events=(data.ev||[]).map(s=>{const p=s.split('|');return{name:p[0],month:parseInt(p[1]),emoji:p[2]||'',lore:(p[3]||'').replace(/‖/g,'|'),icon:p[4]||''};});
  IV.font=data.f||'';
  if(IV.font)ivLoadGFont(IV.font);
  // If the builder already chose interactive mode, skip the chooser
  const mode=params.get('mode');
  if(mode==='interactive'){ ivStartInteractive(); }
  else { ivRenderChooser(); }
}

// Read-only shared view: render the metaphor in preview phase with no toolbar/edit
function ivStartShared(){
  ivPhase='preview';
  const root=document.getElementById('iv-root');
  root.innerHTML='<div class="iv-stage iv-stage-shared" id="iv-stage"></div>';
  ivRenderMetaphor('iv-stage');
}

var _ivToastTimer=null;
function showFcbToast(msg){
  let t=document.getElementById('fcb-toast');
  if(!t){t=document.createElement('div');t.id='fcb-toast';document.body.appendChild(t);}
  t.innerHTML='<span class="fcb-toast-check">✓</span><span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(_ivToastTimer);
  _ivToastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function ivLoadGFont(name){
  if(!name||name.startsWith('Custom-'))return;
  const id='gf-'+name.replace(/\s+/g,'-').toLowerCase();
  if(document.getElementById(id))return;
  const l=document.createElement('link');l.id=id;l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(name)+':ital,wght@0,400;0,700;1,400&display=swap';
  document.head.appendChild(l);
}

/* ── Chooser ── */
function ivRenderChooser(){
  const w=IV.data.w||'Your World';
  document.getElementById('iv-root').innerHTML=`
    <div class="iv-chooser">
      <div class="iv-chooser-inner">
        <h1>${w}</h1>
        <p>Choose how you'd like to view this calendar</p>
        <div class="iv-choices">
          <div class="iv-choice" onclick="location.href='view.html'+location.search">
            <div class="iv-choice-icon">🗂️</div>
            <h2>Normal View</h2>
            <p>The classic calendar card. Switch themes, pick layouts, and download a polished PNG image.</p>
          </div>
          <div class="iv-choice" onclick="ivStartInteractive()">
            <div class="iv-choice-icon">📖</div>
            <h2>Interactive View</h2>
            <p>An immersive, themed experience unique to your world. Customise icons, backgrounds &amp; fonts, then export a self-contained interactive page.</p>
          </div>
        </div>
      </div>
    </div>`;
}

/* ── Start interactive: go to edit phase ── */
let ivPhase='edit';
function ivStartInteractive(){ ivPhase='edit'; ivRenderShell(); }

function ivRenderShell(){
  const root=document.getElementById('iv-root');
  root.innerHTML=`
    <div class="iv-toolbar">
      <div class="iv-toolbar-left">
        <span class="iv-toolbar-title">📖 ${IV.data.w||'Interactive'}</span>
        <div class="iv-tab-group">
          <button class="iv-tab ${ivPhase==='edit'?'active':''}" onclick="ivSetPhase('edit')">Edit</button>
          <button class="iv-tab ${ivPhase==='preview'?'active':''}" onclick="ivSetPhase('preview')">Preview</button>
        </div>
      </div>
      <div style="display:flex;gap:.6rem">
        <button class="iv-btn iv-btn-ghost" onclick="ivRenderChooser()">← Back</button>
        <button class="iv-btn" onclick="ivShareLink()">🔗 Share link</button>
        <button class="iv-btn" onclick="ivExport()">⬇ Export HTML</button>
        <button class="iv-btn" id="iv-save-btn" onclick="ivSaveToCreations()" style="background:var(--accent2,var(--accent));color:var(--bg)">💾 Save</button>
        <a href="#" id="fcb-nav-auth" onclick="FCB_AUTH.openModal();return false" style="font-size:.78rem;color:var(--text-muted);text-decoration:none;font-family:var(--font-body);padding:.3rem .4rem;white-space:nowrap">Set username</a>
      </div>
    </div>
    <div class="iv-share-box" id="iv-share-box" style="display:none">
      <span class="iv-share-label">Read-only interactive link — anyone can open it:</span>
      <div class="iv-share-row">
        <input class="iv-share-url" id="iv-share-url" readonly/>
        <button class="iv-btn" id="iv-share-copy" onclick="ivCopyShare()">Copy</button>
      </div>
    </div>
    <div class="iv-stage" id="iv-stage"></div>`;
  ivRenderStage();
}
function ivSetPhase(p){ ivPhase=p; ivRenderShell(); }

function ivRenderStage(){
  const stage=document.getElementById('iv-stage');
  if(ivPhase==='edit'){ stage.innerHTML=ivEditHTML(); ivRenderMetaphor('iv-edit-canvas'); }
  else { stage.innerHTML='<div id="iv-preview-canvas" style="height:100%"></div>'; ivRenderMetaphor('iv-preview-canvas'); }
}

function ivSelectMonth(i){ IV.selectedMonth=i; IV.lorePage=0;

function ivSetBgColor(value){

function ivUploadBg(){
  const mi=parseInt(document.getElementById('iv-bg-month').value);
  const li=parseInt(document.getElementById('iv-bg-lore').value);
  if(isNaN(mi)||isNaN(li)){ alert('Pick a month and lore entry first.'); return; }
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{

function ivOpenFontLib(){
  document.getElementById('iv-fontlib-search').value='';
  ivRenderFontGrid('');

  setTimeout(()=>document.getElementById('iv-fontlib-search').focus(),100);
}
function ivRenderFontGrid(filter){
  const f=(filter||'').toLowerCase().trim();
  const grid=document.getElementById('iv-fontlib-grid');
  const cats=IV_FONTS.map(c=>{
    const matches=c.fonts.filter(fn=>!f||fn.toLowerCase().includes(f));
    if(!matches.length)return '';
    return `<div style="margin-bottom:1rem">
      <div style="font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-bottom:.45rem">${c.cat}</div>
      <div style="display:flex;flex-wrap:wrap;gap:.4rem">
        ${matches.map(fn=>`<button class="iv-font-opt${IV.font===fn?' active':''}" style="font-family:'${fn}',serif" onclick="ivSelectFontLib('${fn}')">${fn}</button>`).join('')}
      </div></div>`;
  }).filter(Boolean).join('');
  grid.innerHTML=cats||'<div style="text-align:center;color:var(--text-dim);padding:1.5rem;font-size:.8rem">No fonts match that search.</div>';
}
function ivFontSearch(q){ ivRenderFontGrid(q); }
function ivCloseFontLib(){document.getElementById('iv-fontlib-modal').classList.remove('open');}
function ivSelectFontLib(name){
  IV.font=name;IV.customFontFace='';ivLoadGFont(name);
  document.querySelectorAll('.iv-font-opt').forEach(b=>b.classList.toggle('active',b.textContent===name));
  showFcbToast('Font set to '+name);
  setTimeout(ivRenderStage,250);
}

function ivUploadFont(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.ttf,.otf,.woff,.woff2';
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const fontName='Custom-'+Date.now();
      const face=`@font-face{font-family:'${fontName}';src:url(${reader.result})}`;
      IV.customFontFace=face;
      IV.font=fontName;
      const styleEl=document.createElement('style');
      styleEl.textContent=face;
      document.head.appendChild(styleEl);
      showFcbToast('Custom font applied');
      setTimeout(ivRenderStage,150);
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

  clearTimeout(_ivIconTimer);

  _ivIconTimer=setTimeout(()=>ivDoIconSearch(q,'game-icons,twemoji,noto,mdi,fluent-emoji'),350);
}
function ivBrowseIconCat(query,set){ ivDoIconSearch(query,set); }
function ivDoIconSearch(q,prefixes){
  const grid=document.getElementById('iv-iconlib-grid');
  grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:1.5rem;font-size:.8rem">Loading…</div>';
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  fetch('https://api.iconify.design/search?query='+encodeURIComponent(q)+'&limit=96&prefixes='+prefixes)
    .then(r=>r.json()).then(d=>{
      if(!d.icons||!d.icons.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:1.5rem;font-size:.8rem">No icons found. Try another word.</div>';return;}
      grid.innerHTML=d.icons.map(id=>{
        const svgUrl='https://api.iconify.design/'+id.replace(':','/')+'.svg?color='+encodeURIComponent(accent);
        return `<button class="iv-icon-opt" onclick="ivSelectIconLib('${id}')" title="${id}"><img src="${svgUrl}" width="26" height="26" loading="lazy"/></button>`;
      }).join('');
    }).catch(()=>{grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:1.5rem;font-size:.8rem">Icon library unavailable. Check your connection.</div>';});
}
function ivSelectIconLib(id){
  const mi=_ivIconTargetMonth; if(mi===null)return;
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const svgUrl='https://api.iconify.design/'+id.replace(':','/')+'.svg?color='+encodeURIComponent(accent);
  fetch(svgUrl).then(r=>r.text()).then(svg=>{
    const burl='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
    ivCompressImg(burl,32,(small)=>{
      IV.months[mi].icon=small;
      showFcbToast('Icon set for '+(IV.months[mi].name||'Month '+(mi+1)));
      ivCloseIconLib();ivRenderStage();ivRestoreSelect('iv-icon-month',mi);
    });
  }).catch(()=>alert('Could not load that icon.'));
}

function ivCompressImg(dataUrl,maxSize,callback){
  const img=new Image();
  img.onload=()=>{
    let w=img.width, h=img.height;
    if(w>maxSize||h>maxSize){
      if(w>h){ h=Math.round(h*maxSize/w); w=maxSize; }
      else { w=Math.round(w*maxSize/h); h=maxSize; }
    }
    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    callback(canvas.toDataURL('image/png'));
  };
  img.onerror=()=>callback(dataUrl);
  img.src=dataUrl;
}

function ivRestoreSelect(id,value){
  const el=document.getElementById(id);
  if(el) el.value=value;
}

function ivPickIcon(){
  const mi=parseInt(document.getElementById('iv-icon-month').value);
  if(isNaN(mi)){ alert('Pick a month first.'); return; }
  ivOpenIconLib(mi);
}

function ivUploadIcon(){
  const mi=parseInt(document.getElementById('iv-icon-month').value);
  if(isNaN(mi)){ alert('Pick a month first.'); return; }
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      ivCompressImg(reader.result,64,(small)=>{
        IV.months[mi].icon=small;
        showFcbToast('Icon set for '+(IV.months[mi].name||'Month '+(mi+1)));
        ivRenderStage();
        ivRestoreSelect('iv-icon-month',mi);
      });
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function ivShowIconPop(i){
  ivOpenIconLib(i);
  ivRestoreSelect('iv-icon-month',i);
}
</script>
